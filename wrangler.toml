name = "sjz-keyboard-web"
compatibility_date = "2026-08-12"
pages_build_output_dir = "public"

# 曲库放在 D1：原先 public/data/music-catalog.json 需要改文件再重新部署，
# 迁到 D1 后可以随时通过 /api/admin/songs 增删改。
[[d1_databases]]
binding = "DB"
database_name = "sjz-keyboard-web"
database_id = "replace-with-your-d1-id"
migrations_dir = "migrations"

# 管理端令牌：npx wrangler pages secret put ADMIN_TOKEN
# 本地开发写进 .dev.vars（已 gitignore）
