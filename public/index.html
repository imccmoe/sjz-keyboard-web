<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SJZ 三键音乐键盘</title>
    <script>
      // 主题引导：必须在样式表之前执行，否则会先按默认亮色渲染再跳成暗色（白闪）。
      // 规则与 public/theme.js 保持一致：auto 时跟随系统，否则用存储值。
      (function () {
        try {
          var stored = localStorage.getItem("zh-hub-theme");
          var mode = stored === "light" || stored === "dark" ? stored : "auto";
          var resolved = mode === "auto"
            ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : mode;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themeMode = mode;
          root.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <!-- 带版本号：静态服务器通常不发 ETag/Last-Modified，
         Cache-Control: no-cache 缺少验证依据时浏览器仍可能命中弱缓存。
         改动样式后把 v 加一即可强制拉取新文件。 -->
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <div id="app"></div>
    <!-- 主题切换：固定在右下角的浮动按钮。放在静态 HTML 里而不是渲染函数中，
         避免每次重渲染都重建它（浮动元素被重建会导致闪动与焦点丢失）。
         图标与提示由 app.js 的 switchTheme() 维护。 -->
    <button class="theme-toggle" data-action="toggle-theme" type="button"
      aria-label="切换主题">🌗</button>
    <script type="module" src="./app.js"></script>
  </body>
</html>
